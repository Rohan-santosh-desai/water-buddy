<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <canvas id="fx"></canvas>

  <!-- paper plane + banner -->
  <div id="plane" class="hidden">
    <div id="banner"><span id="bannerText">Time to hydrate!</span></div>
    <svg viewBox="0 0 120 70" width="120" height="70" aria-hidden="true">
      <polygon points="4,34 116,4 80,64" fill="#f4f7ff" stroke="#9db4e6" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="4,34 116,4 62,38" fill="#dbe5fb"/>
      <polygon points="62,38 116,4 80,64" fill="#c3d2f3"/>
      <polyline points="62,38 74,50" stroke="#9db4e6" stroke-width="2" fill="none"/>
    </svg>
  </div>

  <!-- character + bubble -->
  <div id="stage" class="hidden">
    <div id="bubble">
      <div id="msg"></div>
      <div id="sub"></div>
    </div>
    <div id="buddyWrap">
    <svg id="buddy" viewBox="0 0 220 430" width="200" height="391" aria-hidden="true">
      <ellipse cx="108" cy="414" rx="62" ry="9" fill="rgba(0,0,0,.28)"/>

      <!-- legs -->
      <g id="legs">
        <rect x="76" y="250" width="28" height="146" rx="12" fill="#3a3f4b"/>
        <rect x="108" y="250" width="28" height="146" rx="12" fill="#444956"/>
        <ellipse cx="88" cy="400" rx="24" ry="11" fill="#f6f6f6"/>
        <ellipse cx="124" cy="400" rx="24" ry="11" fill="#ffffff"/>
        <rect x="64" y="404" width="48" height="5" rx="2" fill="#d5d5d5"/>
        <rect x="100" y="404" width="48" height="5" rx="2" fill="#d5d5d5"/>
      </g>

      <!-- torso: tee + denim jacket -->
      <rect x="68" y="146" width="76" height="116" rx="18" fill="#868b95"/>
      <path d="M64 150 Q62 206 70 262 L88 262 L90 160 Z" fill="#4d73ad"/>
      <path d="M148 150 Q150 206 142 262 L124 262 L122 160 Z" fill="#4d73ad"/>
      <path d="M90 150 L106 190 L122 150" fill="#3f6199"/>
      <rect x="80" y="196" width="18" height="14" rx="3" fill="#3f6199" opacity=".55"/>
      <rect x="114" y="196" width="18" height="14" rx="3" fill="#3f6199" opacity=".55"/>

      <!-- right arm (down) -->
      <path d="M144 166 L152 232" stroke="#4d73ad" stroke-width="22" stroke-linecap="round"/>
      <circle cx="153" cy="242" r="11" fill="#e2a679"/>

      <!-- neck + head -->
      <rect x="97" y="130" width="18" height="22" rx="6" fill="#cf8f63"/>
      <g id="head">
        <circle cx="66" cy="96" r="9" fill="#e2a679"/>
        <circle cx="146" cy="96" r="9" fill="#e2a679"/>
        <ellipse cx="106" cy="92" rx="40" ry="44" fill="#e8ad82"/>
        <path d="M64 88 C58 40 98 28 126 38 C154 46 154 76 148 92 C142 72 122 64 98 66 C80 68 68 76 64 88Z" fill="#1c1b20"/>
        <path d="M70 66 C80 48 104 42 122 46" stroke="#2c2b33" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M80 86 Q91 80 100 85" stroke="#1c1b20" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M114 85 Q123 80 134 86" stroke="#1c1b20" stroke-width="4" fill="none" stroke-linecap="round"/>
        <g id="eyes">
          <ellipse cx="91" cy="99" rx="6.5" ry="7.5" fill="#fff"/>
          <ellipse cx="123" cy="99" rx="6.5" ry="7.5" fill="#fff"/>
          <circle cx="92" cy="100" r="4.4" fill="#2a1a12"/>
          <circle cx="124" cy="100" r="4.4" fill="#2a1a12"/>
          <circle cx="93.5" cy="98" r="1.4" fill="#fff"/>
          <circle cx="125.5" cy="98" r="1.4" fill="#fff"/>
        </g>
        <path d="M106 102 Q103 112 108 114" stroke="#c48557" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path id="mouth" d="M88 119 Q107 140 126 119 Q107 124 88 119Z" fill="#fff" stroke="#8a4b34" stroke-width="2.5" stroke-linejoin="round"/>
        <ellipse cx="80" cy="116" rx="7" ry="4" fill="#f08a7a" opacity=".35"/>
        <ellipse cx="134" cy="116" rx="7" ry="4" fill="#f08a7a" opacity=".35"/>
      </g>

      <!-- left arm (raised) holding bottle -->
      <g id="armL">
        <path d="M70 166 L36 206 L40 150" stroke="#4d73ad" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <g id="bottle">
          <rect x="26" y="96" width="30" height="64" rx="10" fill="#bfe6ff" fill-opacity=".55" stroke="#8fcdf5" stroke-width="2"/>
          <rect x="29" y="118" width="24" height="39" rx="8" fill="#52b6f2" fill-opacity=".75"/>
          <rect x="33" y="84" width="22" height="14" rx="4" fill="#2b86c9"/>
          <rect x="31" y="100" width="4" height="40" rx="2" fill="#fff" opacity=".55"/>
        </g>
        <circle cx="41" cy="146" r="12" fill="#e2a679"/>
        <rect x="30" y="140" width="22" height="7" rx="3" fill="#e2a679"/>
      </g>
    </svg>
    </div>
    <div id="buttons">
      <button id="yes">Drink &#9989;</button>
      <button id="later">Snooze 10m</button>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
